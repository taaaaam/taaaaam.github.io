<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#ffffff" />
    <title>The Banana</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" sizes="16x16 32x32" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script>
      document.documentElement.classList.add("js");
    </script>
  </head>
  <body data-page="blog" class="banana-site">
    <header class="banana-bar">
      <a href="/" class="banana-bar-home">← Home</a>
      <h1 class="banana-masthead">The Banana</h1>
      <div class="banana-bar-actions">
        <button
          type="button"
          id="blog-new-post"
          class="banana-bar-btn is-admin-only"
          hidden
        >
          New post
        </button>
        <button
          type="button"
          id="blog-new-journal"
          class="banana-bar-btn is-admin-only"
          hidden
        >
          New entry
        </button>
        <button
          type="button"
          id="blog-logout"
          class="banana-bar-btn is-admin-only"
          hidden
        >
          Log out
        </button>
      </div>
    </header>

    <main class="banana-main">
      <p id="blog-status" class="blog-status is-admin-only" hidden></p>

      <div class="banana-layout">
        <section class="banana-section banana-posts" aria-labelledby="posts-heading">
          <h2 id="posts-heading" class="banana-section-title">Posts</h2>
          <p id="posts-empty" class="blog-empty" hidden>No posts yet.</p>
          <div id="posts-list" class="posts-mosaic"></div>
        </section>

        <aside class="banana-section banana-journal" aria-labelledby="journal-heading">
          <h2 id="journal-heading" class="banana-section-title">Journal</h2>
          <p id="journal-empty" class="blog-empty" hidden>No entries yet.</p>
          <div id="journal-list" class="journal-list"></div>
        </aside>
      </div>
    </main>

    <div id="compose-modal" class="compose-modal" hidden>
      <div
        class="compose-modal-card"
        role="dialog"
        aria-labelledby="compose-modal-title"
      >
        <div class="compose-modal-head">
          <h2 id="compose-modal-title">Write</h2>
          <button
            type="button"
            id="compose-modal-close"
            class="compose-modal-close"
            aria-label="Close"
          >
            ×
          </button>
        </div>

        <div class="compose-tabs" role="tablist">
          <button
            type="button"
            class="compose-tab is-active"
            data-compose="post"
            role="tab"
            aria-selected="true"
          >
            Post
          </button>
          <button
            type="button"
            class="compose-tab"
            data-compose="journal"
            role="tab"
            aria-selected="false"
          >
            Journal entry
          </button>
        </div>

        <form id="blog-form" class="blog-form">
          <input type="hidden" id="blog-edit-id" value="" />
          <input type="hidden" id="blog-entry-type" value="post" />
          <p id="blog-form-mode" class="blog-form-mode">New post</p>

          <label class="field-post-only">
            <span>Thumbnail</span>
            <input type="file" id="blog-thumbnail-input" accept="image/*" />
            <input type="hidden" id="blog-thumbnail-url" value="" />
            <img
              id="blog-thumbnail-preview"
              class="blog-thumbnail-preview"
              alt=""
              hidden
            />
          </label>

          <label class="field-post-only">
            <span>Title</span>
            <input type="text" id="blog-title-input" maxlength="200" />
          </label>

          <label>
            <span>Date</span>
            <input type="date" id="blog-date-input" required />
          </label>

          <label>
            <span>Text</span>
            <textarea id="blog-body-input" rows="8" required></textarea>
          </label>

          <div class="blog-form-actions">
            <button type="submit" class="btn btn-solid" id="blog-submit-btn">
              Publish
            </button>
            <button type="button" class="btn" id="blog-cancel-edit">
              Cancel
            </button>
          </div>
        </form>
      </div>
    </div>

    <div id="admin-modal" class="admin-modal" hidden>
      <div
        class="admin-modal-card"
        role="dialog"
        aria-labelledby="admin-modal-title"
      >
        <h2 id="admin-modal-title">Admin</h2>
        <form id="admin-form">
          <label for="admin-password">Password</label>
          <input
            type="password"
            id="admin-password"
            autocomplete="current-password"
            required
          />
          <p id="admin-error" class="admin-error" aria-live="polite"></p>
          <div class="admin-modal-actions">
            <button type="button" id="admin-cancel" class="btn">Cancel</button>
            <button type="submit" class="btn btn-solid">Enter</button>
          </div>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="blog-config.js"></script>
    <script src="blog.js"></script>
  </body>
</html>
