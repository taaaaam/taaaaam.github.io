<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#ffd400" />
    <title>Blog — Tam Vu</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" sizes="16x16 32x32" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script>
      document.documentElement.classList.add("js");
    </script>
  </head>
  <body data-page="blog">
    <header class="topbar">
      <a href="/" class="mark">
        <span class="mark-glyph" aria-hidden="true">
          <svg viewBox="29.34 6.64 300 300">
            <g
              transform="translate(0.000000,340.000000) scale(0.100000,-0.100000)"
            >
              <path
                d="M2640 2973 c-21 -9 -182 -164 -391 -376 -356 -360 -356 -360 -399 -313 -55 60 -73 69 -212 106 -62 17 -139 44 -171 60 -67 35 -93 38 -102 10 -9 -28 -6 -31 103 -107 53 -37 115 -81 137 -98 23 -17 62 -39 88 -49 51 -19 57 -32 28 -67 -21 -27 -22 -26 -165 102 -96 85 -126 99 -218 99 -230 0 -387 -100 -627 -400 -169 -210 -188 -257 -125 -302 47 -34 56 -31 176 74 347 304 512 409 653 416 93 5 104 -6 87 -86 -17 -82 -57 -138 -152 -215 -92 -74 -333 -237 -417 -282 -105 -56 -386 -332 -411 -404 -8 -21 -7 -36 4 -56 8 -15 14 -35 14 -44 0 -23 57 -77 102 -96 36 -14 46 -14 180 14 79 17 188 34 243 40 274 26 726 261 1048 544 77 68 77 68 87 42 28 -74 -14 -345 -101 -641 -39 -138 -37 -164 14 -145 25 10 27 8 37 -28 10 -39 75 -91 112 -91 72 0 204 224 264 448 31 114 39 346 16 414 -17 47 -106 129 -166 154 -56 23 -56 25 -8 51 93 52 124 43 192 -57 77 -114 158 -167 338 -224 130 -41 172 -34 172 29 0 26 -12 43 -64 93 -35 34 -66 62 -68 62 -2 0 -60 20 -129 45 -114 42 -129 50 -184 105 -34 34 -82 69 -112 82 -52 23 -52 23 14 108 281 362 378 639 303 855 -45 126 -106 167 -190 128z m-845 -970 c11 -67 10 -66 63 -57 112 21 221 12 299 -25 40 -18 79 -41 88 -50 8 -10 -18 -1 -60 20 -123 62 -202 60 -352 -10 -61 -29 -61 -29 -60 65 2 97 12 122 22 57z"
                fill="currentColor"
              />
            </g>
          </svg>
        </span>
        <span class="mark-name">Tam Vu</span>
      </a>
      <nav class="nav">
        <a href="/"><i>←</i> Home</a>
        <a href="/blog.html" class="on"><i>—</i> Blog</a>
      </nav>
      <button type="button" id="blog-logout" class="status blog-logout-btn">
        Log out
      </button>
    </header>

    <main class="blog-page">
      <div class="band band-blog">
        <div class="band-head">
          <span class="index">—</span>
          <h2>Blog</h2>
          <span class="head-glyph hg-bar" aria-hidden="true"></span>
        </div>

        <p id="blog-status" class="blog-status"></p>

        <form id="blog-form" class="blog-form">
          <input type="hidden" id="blog-edit-id" value="" />
          <p id="blog-form-mode" class="blog-form-mode">New post</p>
          <label>
            <span>Date</span>
            <input type="date" id="blog-date-input" required />
          </label>
          <label>
            <span>Title</span>
            <input type="text" id="blog-title-input" required maxlength="200" />
          </label>
          <label>
            <span>Text</span>
            <textarea id="blog-body-input" rows="8" required></textarea>
          </label>
          <div class="blog-form-actions">
            <button type="submit" class="btn btn-solid" id="blog-submit-btn">
              Publish
            </button>
            <button
              type="button"
              class="btn"
              id="blog-cancel-edit"
              hidden
            >
              Cancel edit
            </button>
          </div>
        </form>

        <p id="blog-empty" class="blog-empty" hidden>No posts yet.</p>
        <div id="blog-list" class="blog-list"></div>
      </div>
    </main>

    <div id="admin-modal" class="admin-modal" hidden>
      <div class="admin-modal-card" role="dialog" aria-labelledby="admin-modal-title">
        <h2 id="admin-modal-title">Admin</h2>
        <form id="admin-form">
          <label for="admin-password">Password</label>
          <input
            type="password"
            id="admin-password"
            autocomplete="current-password"
            required
          />
          <p id="admin-error" class="admin-error" aria-live="polite"></p>
          <div class="admin-modal-actions">
            <button type="button" id="admin-cancel" class="btn">Cancel</button>
            <button type="submit" class="btn btn-solid">Enter</button>
          </div>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="blog-config.js"></script>
    <script src="blog.js"></script>
  </body>
</html>
